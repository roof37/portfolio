<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Blog - Ralph Halabi</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../scope.css">
</head>
<body>

  <!-- Apply dark mode before paint to prevent flash -->
  <script>
    const theme = sessionStorage.getItem('theme');
    const match = window.matchMedia("(prefers-color-scheme: dark)").matches;
    if ((theme && theme === 'dark') || (!theme && match)) {
      document.body.classList.add('dark');
    }
  </script>

  <div id="wrapper"><main>
    <!-- Sub-page header with back link and theme toggle -->
    <div id="site-header"></div>
    <script src="../site-header.js"></script>

    <h1 class="page-title">Blog Posts</h1>

    <div class="post-list">
      <div class="empty-state"><span class="tag">Coming soon</span><h3>No posts yet</h3><p>I'll share write-ups on sports analytics here. Check back soon.</p></div>
      <!--
        To add a new post, create posts/my-post/index.html, then add a block like:
        <a class="post-link" href="my-post/">
          <span>Post title</span>
          <span class="date">MM-DD-YYYY</span>
        </a>
        and update:
        1. href — the folder name for the post (e.g. "bda-baseball-ch2/")
        2. The title text
        3. The date
        Keep newest posts at the top.
      -->
    </div>

  </main></div>

  <script>
    // --------------------------
    // Dark / Light theme toggle
    // --------------------------
    const toggle = document.getElementById('theme-toggle');
    if (toggle) {
      toggle.addEventListener('click', () => {
        document.body.classList.toggle('dark');
        sessionStorage.setItem(
          'theme',
          document.body.classList.contains('dark') ? 'dark' : 'light'
        );
      });
    }
  </script>
</body>
</html>
