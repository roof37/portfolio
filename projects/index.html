<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>Projects - Ralph Halabi</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../scope.css">
</head>
<body>

  <!-- Light by default; apply dark before paint only if the visitor chose it -->
  <script>
    const theme = sessionStorage.getItem('theme');
    if (theme === 'dark') {
      document.body.classList.add('dark');
    }
  </script>

  <div id="wrapper"><main>
    <!-- Sub-page header with back link and theme toggle -->
    <div id="site-header"></div>
    <script src="../site-header.js"></script>

    <h1 class="page-title underline-orange">Projects</h1>
    
    <div class="projects-grid"></div>

  </main></div>

  <script type="module" src="projects.js"></script>
</body>
</html>
